<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login to your account</title>
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #667085;
    --border: #d5dbe5;
    --accent: #2f5bea;
    --accent-dark: #2447c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    padding: 36px 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(20, 30, 60, 0.1);
  }
  h1 { font-size: 1.6rem; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 91, 234, 0.2);
  }
  .forgot { text-align: right; margin: -6px 0 22px; }
  .forgot a { color: var(--accent); font-size: 0.875rem; text-decoration: none; }
  .forgot a:hover { text-decoration: underline; }
  button {
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 3px solid rgba(47, 91, 234, 0.4); outline-offset: 2px; }
  @media (max-width: 480px) {
    .card { padding: 28px 22px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your account</p>

    <form onsubmit="event.preventDefault(); alert('Login clicked!');">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="forgot"><a href="#">Forgot Password?</a></div>

      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
